services:
  php-fpm-blue:
    volumes: !reset []

  php-fpm-green:
    volumes: !reset [ ]

  nginx:
    image: nginx:${NGINX_VERSION:-1.30}-alpine
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/upstreams:/etc/nginx/upstreams
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      - NGINX_HOST=${NGINX_HOST}
      - NGINX_PORT=${NGINX_PORT}
    restart: on-failure

  db:
    image: postgres:${POSTGRES_VERSION}-alpine
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-root}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-currentPassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-laravel}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  artisan:
    volumes: !reset [ ]

volumes:
  postgres_data: